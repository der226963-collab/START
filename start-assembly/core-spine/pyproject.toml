[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "start-core-spine"
version = "0.1.0"
description = "START core-spine adapters (local assembly only)"
requires-python = ">=3.12"

# Direct dependencies only; versions are the ones actually installed
# and verified in .venv on 2026-11-10 (see ASSEMBLY_REPORT.md).
# numpy/scipy resolved newer than the system 1.26.4/1.11.4.
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pyarrow==26.0.1",
    "grpcio==1.85.1",
    "grpcio-tools==1.85.1",
    "langgraph==1.2.20",
    "cpmpy==1.1.1",
    "cvxpy==1.9.3",
    "highspy==1.15.1",
    "deepeval==4.3.3",
]
