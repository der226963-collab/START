# NOTE (2026-11-10): per-package compat bounds REMOVED in this env.
# The pinned bounds (MTK 9, Turing 0.34, Agents 6, DiffEq 7.17)
# resolved on Julia 1.13.3 AND 1.11.9 to transitive versions they
# were never tested with (DiffEqBase/SteadyStateDiffEq,
# Distributions @check_args, DynamicQuantitiesSciMLBaseExt) and 5
# direct deps failed to precompile on both Julia versions.
# This env lets Pkg resolve the newest mutually-compatible set.
# The pinned envs in julia/ (1.13) and julia-1.11/ (1.11) are kept
# untouched as evidence.
# NOTE (2026-11-11): the three compat bounds above (Graphs 1.15.0,
# JSON 1.13.4, NetworkDynamics 1.3.0) are the versions Pkg resolved
# and pinned when the packages were added; they are exact resolved
# versions, not ranges chosen in advance. Adding NetworkDynamics
# pulled in 26 new Manifest packages (itself + 25 transitive) and
# changed no existing package version; adding Graphs changed nothing
# (already present as a transitive dep). Adding JSON likewise
# changed nothing: "Manifest No packages added to or removed".
