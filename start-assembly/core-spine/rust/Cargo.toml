[package]
name = "start-core-spine"
version = "0.1.0"
edition = "2021"
description = "START core-spine Rust kernels: Cedar governance, egg e-graph rewrites, Tonic gRPC stub"
license = "MIT OR Apache-2.0"

[lib]
name = "start_core_spine"
path = "src/lib.rs"

[[bin]]
name = "start-spine"
path = "src/main.rs"

[dependencies]
cedar-policy = "4"
egg = "0.10"
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
