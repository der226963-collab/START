# START core-spine — Julia environment.
# Julia 1.13.3 installed 2026-11-10 at ~/.juliaup/bin/julia.
# Install: `julia --project=. -e "import Pkg; Pkg.instantiate()"`.
#
# WARNING: Pkg rewrites this file when adding a dependency and DROPS
# all comments (this happened on 2026-11-11 when JSON.jl was added).
# If the comments vanish after a Pkg.add, restore them from the
# pushed copy on GitHub (start-assembly/core-spine/julia-current/)
# before pushing again — they carry the UUID/licence provenance.
#
# UUID CORRECTION (2026-11-10): the first draft of this file had
# wrong/malformed UUIDs for Agents, Symbolics, HiGHS and
# ModelingToolkit (e.g. ModelingToolkit ended in an 11-char group).
# They were corrected against each repo's own upstream Project.toml
# on GitHub (raw.githubusercontent.com) before instantiate:
# Agents f70cc89e6671, Symbolics 4792-8d23-62f2024744c7,
# HiGHS bb2238e4078b, ModelingToolkit 94e3-6117800e7a78.
# Turing, DifferentialEquations and JuMP UUIDs already matched upstream.
# NetworkDynamics UUID 22e9dc34-2a0d-11e9-0de0-8588d035468b and Graphs UUID
# 86223c79-3864-5bf0-83f7-82e725a168b6 likewise verified against the
# upstream Project.toml files before adding (2026-11-11).
#
# Packages, all from the General registry except AlphaZero (see note):
#   Agents.jl             JuliaDynamics/Agents.jl, MIT
#   ModelingToolkit.jl    SciML/ModelingToolkit.jl, MIT
#   Symbolics.jl          JuliaSymbolics/Symbolics.jl, MIT
#   Turing.jl             TuringLang/Turing.jl, MIT
#   DifferentialEquations.jl  SciML/DifferentialEquations.jl — LICENCE
#                         CAUTION: GitHub shows NOASSERTION for this repo;
#                         confirm the licence before adopting it.
#   JuMP.jl               jump-dev/JuMP.jl, MPL-2.0
#   HiGHS.jl              jump-dev/HiGHS.jl, MIT (solver backend for JuMP)
#   NetworkDynamics.jl    JuliaDynamics/NetworkDynamics.jl, MIT, 1.3.0
#                         (added 2026-11-11; the sweep said 1.4.0 but the
#                         General registry latest is 1.3.0 — verified
#                         against the registry Versions.toml and the
#                         upstream v1.3.0 release, 2026-09-01)
#   Graphs.jl             JuliaGraphs/Graphs.jl, MIT, 1.15.0 (added
#                         2026-11-11 as a direct dependency for building
#                         the network graph in network_dynamics.jl; it
#                         was already in the Manifest as a transitive dep,
#                         so the resolved set is otherwise unchanged)
#   JSON.jl               JuliaIO/JSON.jl, MIT, 1.13.4 (added 2026-11-11
#                         as a direct dependency so the planning-search
#                         test-vectors consuming test can parse the real
#                         test-vectors.json file instead of a
#                         hand-transcribed table; it was already in the
#                         Manifest as a transitive dep, so the resolved
#                         set is otherwise unchanged)
#
# AlphaZero.jl (jonathan-laurent/AlphaZero.jl, MIT) is NOT in the
# General registry: it is used by cloning the repo
# (`git clone https://github.com/jonathan-laurent/AlphaZero.jl`)
# and running with `--project` inside that clone. It is therefore
# NOT listed as a registry dependency here; it is cloned and
# smoke-tested separately (see julia/logs/ and ASSEMBLY_REPORT.md).
# Do not claim it was installed or tested here unless that run
# actually happened.
#
# The v0.3.2 Julia findings (REVIEW.md ISSUE-05, ISSUE-07) still apply:
# the review-copy Julia planning module does not implement the
# constraint contract (no constraint_id/operator/unit, invented
# statuses :candidate_feasible / :candidate_infeasible). The script
# julia/spine.jl in this folder is a runnable adapter against the
# five-state wire vocabulary (verified 2026-11-10, see its header).

